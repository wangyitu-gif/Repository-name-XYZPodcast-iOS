name: XYZPodcast
options:
  bundleIdPrefix: com.xyzpodcast
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_NAME: XYZPodcast
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  XYZPodcast:
    type: application
    platform: iOS
    sources:
      - path: XYZPodcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xyzpodcast.app
        INFOPLIST_FILE: XYZPodcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: XYZPodcast/XYZPodcast.entitlements
