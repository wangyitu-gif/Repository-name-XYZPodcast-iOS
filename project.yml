name: XYZPodcast
options:
  bundleIdPrefix: com.xyzpodcast
  deploymentTarget:
    iOS: "15.0"
targets:
  XYZPodcast:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xyzpodcast.app
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: XYZPodcast.entitlements
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
