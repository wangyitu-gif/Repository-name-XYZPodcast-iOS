name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling (xcodegen + ldid)
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project XYZPodcast.xcodeproj \
            -scheme XYZPodcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/XYZPodcast.xcarchive \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Fake-sign with ldid & package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/XYZPodcast.xcarchive/Products/Applications/XYZPodcast.app" build/Payload/
          ldid -SXYZPodcast/XYZPodcast.entitlements build/Payload/XYZPodcast.app/XYZPodcast
          cd build && zip -r XYZPodcast.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYZPodcast-ipa
          path: build/XYZPodcast.ipa
