name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s $(ls -d /Applications/Xcode*.app | head -1)/Contents/Developer

      - name: Clean stale files
        run: |
          rm -f XYZPodcast/AppDelegate.swift XYZPodcast/SceneDelegate.swift XYZPodcast/XYZPodcast.entitlements XYZPodcast/project.yml
          mkdir -p XYZPodcast/XYZPodcast.xcodeproj

      - name: Copy pbxproj into place
        run: cp project.pbxproj XYZPodcast/XYZPodcast.xcodeproj/project.pbxproj

      - name: Debug tree
        run: find XYZPodcast -type f

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project XYZPodcast/XYZPodcast.xcodeproj \
            -scheme XYZPodcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/XYZPodcast.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/XYZPodcast.xcarchive/Products/Applications/XYZPodcast.app" build/Payload/
          cd build && zip -r XYZPodcast.ipa Payload && cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYZPodcast-ipa
          path: build/XYZPodcast.ipa
