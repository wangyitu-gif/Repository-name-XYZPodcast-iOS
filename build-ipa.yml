name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s $(ls -d /Applications/Xcode*.app | head -1)/Contents/Developer

      - name: Generate project sources
        run: |
          python3 << 'PYEOF'
          import os
          os.makedirs("XYZPodcast/XYZPodcast.xcodeproj", exist_ok=True)

          swift = r'''import UIKit
          import AVFoundation
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback)
                      try AVAudioSession.sharedInstance().setActive(true)
                  } catch {}
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          class ViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .white
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  if #available(iOS 15.0, *) {
                      config.defaultWebpagePreferences.allowsContentJavaScript = true
                  }
                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.navigationDelegate = self
                  view.addSubview(webView)
                  loadRemote()
              }
              func loadRemote() {
                  guard let url = URL(string: "https://xyz-podcast.pages.dev") else { return }
                  var req = URLRequest(url: url)
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  webView.load(req)
              }
              override func viewDidLayoutSubviews() {
                  super.viewDidLayoutSubviews()
                  webView?.frame = view.bounds
              }
          }
          '''

          plist = '''<?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>XYZPodcast</string>
              <key>CFBundleDisplayName</key>
              <string>XYZ播客</string>
              <key>CFBundleIdentifier</key>
              <string>com.xyzpodcast.app</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>XYZPodcast</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          '''

          pbxproj = """// !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = {
          	};
          	objectVersion = 56;
          	objects = {

          		/* Begin PBXBuildFile section */
          		AA0000010000000000000001 /* ViewController.swift in Sources */ = {isa = PBXBuildFile; fileRef = AA0000010000000000000101 /* ViewController.swift */; };
          		/* End PBXBuildFile section */

          		/* Begin PBXFileReference section */
          		AA0000010000000000000101 /* ViewController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ViewController.swift; sourceTree = "<group>"; };
          		AA0000010000000000000102 /* XYZPodcast.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = XYZPodcast.app; sourceTree = BUILT_PRODUCTS_DIR; };
          		AA0000010000000000000103 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          		/* End PBXFileReference section */

          		/* Begin PBXFrameworksBuildPhase section */
          		AA0000010000000000000201 /* Frameworks */ = {
          			isa = PBXFrameworksBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          		/* End PBXFrameworksBuildPhase section */

          		/* Begin PBXGroup section */
          		AA0000010000000000000301 = {
          			isa = PBXGroup;
          			children = (
          				AA0000010000000000000101 /* ViewController.swift */,
          				AA0000010000000000000103 /* Info.plist */,
          				AA0000010000000000000401 /* Products */,
          			);
          			sourceTree = "<group>";
          		};
          		AA0000010000000000000401 /* Products */ = {
          			isa = PBXGroup;
          			children = (
          				AA0000010000000000000102 /* XYZPodcast.app */,
          			);
          			name = Products;
          			sourceTree = "<group>";
          		};
          		/* End PBXGroup section */

          		/* Begin PBXNativeTarget section */
          		AA0000010000000000000501 /* XYZPodcast */ = {
          			isa = PBXNativeTarget;
          			buildConfigurationList = AA0000010000000000000701 /* Build configuration list for PBXNativeTarget "XYZPodcast" */;
          			buildPhases = (
          				AA0000010000000000000601 /* Sources */,
          				AA0000010000000000000201 /* Frameworks */,
          				AA0000010000000000000802 /* Resources */,
          			);
          			buildRules = (
          			);
          			dependencies = (
          			);
          			name = XYZPodcast;
          			productName = XYZPodcast;
          			productReference = AA0000010000000000000102 /* XYZPodcast.app */;
          			productType = "com.apple.product-type.application";
          		};
          		/* End PBXNativeTarget section */

          		/* Begin PBXProject section */
          		AA0000010000000000000901 /* Project object */ = {
          			isa = PBXProject;
          			attributes = {
          				LastSwiftUpdateCheck = 1500;
          				LastUpgradeCheck = 1500;
          				TargetAttributes = {
          					AA0000010000000000000501 = {
          						CreatedOnToolsVersion = 15.0;
          					};
          				};
          			};
          			buildConfigurationList = AA0000010000000000000801 /* Build configuration list for PBXProject "XYZPodcast" */;
          			compatibilityVersion = "Xcode 14.0";
          			developmentRegion = en;
          			hasScannedForEncodings = 0;
          			knownRegions = (
          				en,
          				Base,
          			);
          			mainGroup = AA0000010000000000000301;
          			productRefGroup = AA0000010000000000000401 /* Products */;
          			projectDirPath = "";
          			projectRoot = "";
          			targets = (
          				AA0000010000000000000501 /* XYZPodcast */,
          			);
          		};
          		/* End PBXProject section */

          		/* Begin PBXResourcesBuildPhase section */
          		AA0000010000000000000802 /* Resources */ = {
          			isa = PBXResourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          		/* End PBXResourcesBuildPhase section */

          		/* Begin PBXSourcesBuildPhase section */
          		AA0000010000000000000601 /* Sources */ = {
          			isa = PBXSourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          				AA0000010000000000000001 /* ViewController.swift in Sources */,
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          		/* End PBXSourcesBuildPhase section */

          		/* Begin XCBuildConfiguration section */
          		AA0000010000000000000702 /* Debug */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = dwarf;
          				ENABLE_STRICT_OBJC_MSGSEND = YES;
          				ENABLE_TESTABILITY = YES;
          				GCC_C_LANGUAGE_STANDARD = gnu11;
          				GCC_DYNAMIC_NO_PIC = NO;
          				GCC_NO_COMMON_BLOCKS = YES;
          				GCC_OPTIMIZATION_LEVEL = 0;
          				GCC_PREPROCESSOR_DEFINITIONS = (
          					"DEBUG=1",
          					"$(inherited)",
          				);
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          				GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          				GCC_WARN_UNUSED_FUNCTION = YES;
          				GCC_WARN_UNUSED_VARIABLE = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
          				MTL_FAST_MATH = YES;
          				ONLY_ACTIVE_ARCH = YES;
          				PRODUCT_BUNDLE_IDENTIFIER = com.xyzpodcast.app;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG;
          				SWIFT_OPTIMIZATION_LEVEL = "-Onone";
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          				CODE_SIGNING_ALLOWED = NO;
          				CODE_SIGN_IDENTITY = "";
          				CODE_SIGN_STYLE = Manual;
          				DEVELOPMENT_TEAM = "";
          				ENABLE_BITCODE = NO;
          				INFOPLIST_FILE = Info.plist;
          				LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks";
          			};
          			name = Debug;
          		};
          		AA0000010000000000000703 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
          				ENABLE_NS_ASSERTIONS = NO;
          				ENABLE_STRICT_OBJC_MSGSEND = YES;
          				GCC_C_LANGUAGE_STANDARD = gnu11;
          				GCC_NO_COMMON_BLOCKS = YES;
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          				GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          				GCC_WARN_UNUSED_FUNCTION = YES;
          				GCC_WARN_UNUSED_VARIABLE = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				MTL_ENABLE_DEBUG_INFO = NO;
          				MTL_FAST_MATH = YES;
          				PRODUCT_BUNDLE_IDENTIFIER = com.xyzpodcast.app;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_COMPILATION_MODE = wholemodule;
          				SWIFT_OPTIMIZATION_LEVEL = "-O";
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          				CODE_SIGNING_ALLOWED = NO;
          				CODE_SIGN_IDENTITY = "";
          				CODE_SIGN_STYLE = Manual;
          				DEVELOPMENT_TEAM = "";
          				ENABLE_BITCODE = NO;
          				INFOPLIST_FILE = Info.plist;
          				LD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks";
          				VALIDATE_PRODUCT = YES;
          			};
          			name = Release;
          		};
          		AA0000010000000000000803 /* Debug */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				SWIFT_VERSION = 5.0;
          				CODE_SIGNING_ALLOWED = NO;
          			};
          			name = Debug;
          		};
          		AA0000010000000000000804 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				SWIFT_VERSION = 5.0;
          				CODE_SIGNING_ALLOWED = NO;
          			};
          			name = Release;
          		};
          		/* End XCBuildConfiguration section */

          		/* Begin XCConfigurationList section */
          		AA0000010000000000000701 /* Build configuration list for PBXNativeTarget "XYZPodcast" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				AA0000010000000000000702 /* Debug */,
          				AA0000010000000000000703 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          		};
          		AA0000010000000000000801 /* Build configuration list for PBXProject "XYZPodcast" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				AA0000010000000000000803 /* Debug */,
          				AA0000010000000000000804 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          		};
          		/* End XCConfigurationList section */
          	};
          	rootObject = AA0000010000000000000901 /* Project object */;
          }
          """

          with open("XYZPodcast/ViewController.swift", "w") as f:
              f.write(swift)
          with open("XYZPodcast/Info.plist", "w") as f:
              f.write(plist)
          with open("XYZPodcast/XYZPodcast.xcodeproj/project.pbxproj", "w") as f:
              f.write(pbxproj)

          import subprocess
          result = subprocess.run(["find", "XYZPodcast", "-type", "f"], capture_output=True, text=True)
          print(result.stdout)
          print("DONE: all sources written")
          PYEOF

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project XYZPodcast/XYZPodcast.xcodeproj \
            -scheme XYZPodcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/XYZPodcast.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/XYZPodcast.xcarchive/Products/Applications/XYZPodcast.app" build/Payload/
          cd build && zip -r XYZPodcast.ipa Payload && cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYZPodcast-ipa
          path: build/XYZPodcast.ipa
